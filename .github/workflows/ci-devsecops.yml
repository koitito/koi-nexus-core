name: Koi Nexus — DevSecOps & Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-typecheck:
    name: TypeCheck & Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 4. Instalar dependencias
        run: pnpm install --frozen-lockfile=false

      - name: 5. Auditoría de Tipos Estrictos (TypeScript)
        run: pnpm tsc --noEmit

      - name: 6. Escaneo de Vulnerabilidades DevSecOps (Aqua Security Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Reporta en los logs sin bloquear el primer deploy